name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-tap:
    name: Test Formula (macOS)
    runs-on: macos-14

    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Audit Formula
        run: |
          brew audit thingk0/tap/macbay

      - name: Build and install from source
        run: |
          brew install --build-from-source thingk0/tap/macbay

      - name: Run brew test
        run: |
          brew test thingk0/tap/macbay

      - name: Verify CLI executables and help
        run: |
          mb --version
          macbay --version
          mb --help

      - name: Verify clean command rejection
        run: |
          if mb clean; then
            echo "Expected 'mb clean' to fail, but it succeeded!"
            exit 1
          else
            echo "'mb clean' failed as expected."
          fi

      - name: Test uninstall
        run: |
          brew uninstall macbay
          ! which mb
          ! which macbay
